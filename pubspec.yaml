name: safeai_drive
description: "SafeAI Drive - AI-Powered Road Safety Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Maps — OpenStreetMap (NO API KEY REQUIRED)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Camera — direct device camera access, no keys needed
  camera: ^0.11.0+2

  # Firebase — Firestore for reports and zones only
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Voice & TTS
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0

  # Vibration
  vibration: ^2.0.0

  # Utils
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
